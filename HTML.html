<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KỲ VỌNG GỬI ĐẠI HỘI LẦN THỨ XIX</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://fonts.googleapis.com/css?family=Roboto' rel='stylesheet'>
    
</head>
<body>
    <div class="background">
        <header>
            <h1>Chào mừng đại hội đại biểu đoàn TNCS Hồ Chí Minh tỉnh Hà Tĩnh lần thứ XIX, nhiệm kỳ 2025 - 2030</h1>
        </header>
        <div class="content">
            <section class="input_form">
                <form id="messageForm">
                    <p class="form_title">Tạo thông điệp</p>

                    <label for="avatarInput" class="upload_label">
                        <span>Chọn ảnh</span>
                        <input type="file" id="avatarInput" accept="image/*" hidden>
                    </label>

                    <label style="width: 80px; margin-top: 10px;" for="username">Họ và tên</label>
                    <input type="text" id="username" placeholder="Nhập họ và tên...">

                    <label style="width: 80px; margin-top: 10px;" for="role">Chức vụ</label>
                    <textarea id="role" placeholder="Chức vụ..."></textarea>

                    <label style="width: 170px; margin-top: 10px;" for="message">Gửi lời nhắn đến đại hội</label>
                    <textarea id="message" placeholder="Hãy gửi thông điệp của bạn..."></textarea>  

                    <button type="submit" id="download">Tải lời nhắn về</button>
                </form>
            </section>

            <section class="img_form">
                <div class="frame_canvas">
                    <img src="pics/thoong diep chao mung.zip - 2.png" alt="Khung thông điệp" class="template_img">
                    
                    <div class="image_choosen">
                        <img src="pics/placeholder.jpg" alt="Ảnh đại diện" id="img_choosen">
                    </div>

                    <div class="message_box">
                        <p class="message_content">Gửi lời nhắn đến đại hội...</p>
                    </div>
                </div>
            </section>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
